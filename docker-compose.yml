services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: empanadas_db
      MYSQL_USER: emp_user
      MYSQL_PASSWORD: emp_pass
    ports:
      - "3307:3306"  # Changed host port to 3307 to avoid conflicts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/mysql
      - ./_docker/mysql/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: emp_user
      PMA_PASSWORD: emp_pass
    ports:
      - "8082:80"
    depends_on:
      - db

  api:
    build: ./api
    env_file: ./api/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  dbdata: {}
